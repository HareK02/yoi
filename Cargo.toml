[workspace]
resolver = "2"
members = [
    "crates/client",
    "crates/daemon",
    "crates/llm-worker",
    "crates/llm-worker-macros",
    "crates/session-store",
    "crates/secrets",
    "crates/manifest",
    "crates/pod",
    "crates/plugin-pdk",
    "crates/yoi",
    "crates/pod-store",
    "crates/protocol",
    "crates/provider",
    "crates/pod-registry",
    "crates/session-metrics",
    "crates/session-analytics",
    "crates/lint-common",
    "crates/tools",
    "crates/tui",
    "crates/memory",
    "crates/ticket",
    "crates/project-record",
    "crates/workflow",
    "tests/e2e",
]
default-members = [
    "crates/client",
    "crates/daemon",
    "crates/llm-worker",
    "crates/llm-worker-macros",
    "crates/session-store",
    "crates/secrets",
    "crates/manifest",
    "crates/pod",
    "crates/plugin-pdk",
    "crates/yoi",
    "crates/pod-store",
    "crates/protocol",
    "crates/provider",
    "crates/pod-registry",
    "crates/session-metrics",
    "crates/session-analytics",
    "crates/lint-common",
    "crates/tools",
    "crates/tui",
    "crates/memory",
    "crates/ticket",
    "crates/project-record",
    "crates/workflow",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
client = { path = "crates/client" }
llm-worker = { path = "crates/llm-worker", version = "0.2" }
llm-worker-macros = { path = "crates/llm-worker-macros", version = "0.2" }
manifest = { path = "crates/manifest" }
lint-common = { path = "crates/lint-common" }
memory = { path = "crates/memory" }
ticket = { path = "crates/ticket" }
project-record = { path = "crates/project-record" }
pod = { path = "crates/pod" }
yoi-plugin-pdk = { path = "crates/plugin-pdk" }
yoi = { path = "crates/yoi" }
pod-registry = { path = "crates/pod-registry" }
pod-store = { path = "crates/pod-store" }
protocol = { path = "crates/protocol" }
provider = { path = "crates/provider" }
session-metrics = { path = "crates/session-metrics" }
session-analytics = { path = "crates/session-analytics" }
session-store = { path = "crates/session-store" }
secrets = { path = "crates/secrets" }
tools = { path = "crates/tools" }
tui = { path = "crates/tui" }

# External
# Note: `reqwest` and `chrono` are not aggregated here because some crates
# need `default-features = false`, which workspace inheritance cannot override.
async-trait = "0.1"
fs4 = "0.13"
futures = "0.3"
libc = "0.2"
schemars = "1.2"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.52"
toml = "1.1"
tracing = "0.1"
uuid = "1.23"

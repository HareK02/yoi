[package]
name = "pod-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fs4 = { version = "0.13.1", features = ["sync"] }
libc = "0.2.185"
manifest = { version = "0.1.0", path = "../manifest" }
serde = { version = "1.0.228", features = ["derive"] }

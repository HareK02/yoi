[package]
name = "runtime-api"
description = "Typed JSON REST contract for Yoi Runtime Worker management"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
api-macros = { workspace = true, features = ["reqwest", "axum", "error-contract"] }
error-contract.workspace = true
serde_json.workspace = true
manifest.workspace = true
plugin-plan = { path = "../plugin-plan" }
protocol.workspace = true
session-store.workspace = true
serde = { workspace = true, features = ["derive"] }
workdir.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[package]
name = "tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
fs-operation.workspace = true
html5ever = "0.26"
agen = { workspace = true }
error-contract = { workspace = true, features = ["json-schema"] }
manifest = { workspace = true }
secrets = { workspace = true }
markup5ever_rcdom = "0.2"
pdf-extract = "0.10.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "sync", "time"] }
tracing = { workspace = true }
workdir = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
axum.workspace = true
workdir = { workspace = true, features = ["http-client"] }
jsonschema = { version = "0.33.0", default-features = false }
error-contract = { workspace = true, features = ["test-support"] }
filetime = "0.2.27"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[package]
name = "workspace-drive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
feature-storage.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v7"] }
# Staging cleanup recognizes this version's local filename protocol. Reinspect
# local publication and durability before upgrading, even within a patch series.
object_store = { version = "=0.13.2", default-features = false, features = ["fs"] }
bytes.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
tempfile.workspace = true

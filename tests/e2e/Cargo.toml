[package]
name = "yoi-e2e"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = []
e2e = []

[dependencies]
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "panel"
path = "tests/panel.rs"
required-features = ["e2e"]

[[test]]
name = "rewind"
path = "tests/rewind.rs"
required-features = ["e2e"]
